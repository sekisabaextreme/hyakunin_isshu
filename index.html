<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="百人一首">
<title>百人一首トレーニング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: 1-column mobile app. Poem cards are vertical (tategaki), 3 columns for the upper verse, 2 for the lower, like a real karuta card. */
:root{
  --bg:#eceff3; --surface:#f8f9fb; --paper:#fcfcf9; --ink:#17202e; --muted:#5a6575; --line:#ccd2dc;
  --accent:#27407a; --accent-ink:#ffffff; --ok:#1f7a54; --ng:#b3372b; --late:#8b94a3;
  --kfs:clamp(20px,min(7.4vw,6vh),32px); --ofs:clamp(13px,min(4.2vw,3.4vh),19px);
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141f; --surface:#161e2c; --paper:#1b2536; --ink:#e6eaf2; --muted:#9aa5b8; --line:#2b3649;
    --accent:#8aa6e8; --accent-ink:#0e141f; --ok:#58c79a; --ng:#ef7f72; --late:#6f7b90; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141f; --surface:#161e2c; --paper:#1b2536; --ink:#e6eaf2; --muted:#9aa5b8; --line:#2b3649;
  --accent:#8aa6e8; --accent-ink:#0e141f; --ok:#58c79a; --ng:#ef7f72; --late:#6f7b90; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.home-grid{display:grid;gap:14px}
.home-grid>*{min-width:0}
h1{font-family:var(--serif);font-size:26px;line-height:1.2;margin:0;letter-spacing:.06em}
h2{font-size:13px;margin:0 0 8px;color:var(--muted);letter-spacing:.12em;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 16px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.f{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
input[type=number],select,textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;font-size:16px}
input[type=number]{width:84px}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea{width:100%;min-height:150px;font-size:16px}
.note{font-size:13px;color:var(--muted)}
.banner{border:1px dashed var(--accent);border-radius:10px;padding:12px;font-size:14px}
.count{font-weight:700;color:var(--accent)}
.modes{display:grid;gap:10px}
.modes .btn small{display:block;font-weight:400;font-size:12px;opacity:.85}
/* vertical poem */
.vert{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--serif);letter-spacing:.08em;line-height:1.5}
.vert{font-size:calc(var(--F,16px)*var(--sc,1));height:calc(var(--F,16px)*var(--H,9.3))}
.vert .ph{margin-left:.7em;padding-top:calc(1em*var(--o,0));white-space:nowrap}
.kami{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 10px;display:flex;justify-content:center;align-items:flex-start}
.kami{--F:var(--kfs)}.kami .vert{font-weight:500}
.c{opacity:0;visibility:hidden;transition:opacity .2s}
.c.on{opacity:1;visibility:visible}
.c.late{opacity:.5;color:var(--late)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{font:inherit;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:12px 4px;cursor:pointer;display:flex;justify-content:center;align-items:flex-start;min-height:calc(var(--ofs)*9.3 + 28px)}
.opt{--F:var(--ofs)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opt.wrong{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 14%,var(--paper))}
.opt[aria-disabled="true"]{cursor:pointer}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.fb{display:flex;flex-direction:column;gap:10px}
.mark{font-family:var(--serif);font-size:44px;line-height:1;font-weight:700}
.mark.ok{color:var(--ok)} .mark.ng{color:var(--ng)}
.poemfull{border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.poemfull .j{font-family:var(--serif);font-size:17px}
.poemfull .r{color:var(--muted);font-size:12px}
.poemfull .a{margin-top:4px;font-size:13px}
.big-score{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.miss{display:flex;flex-direction:column;gap:12px}
.miss .poemfull{border-top:none;padding-top:0}
.miss li{list-style:none;border-bottom:1px solid var(--line);padding-bottom:10px}
ul{margin:0;padding:0}
.fold{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.fold summary{cursor:pointer;font-weight:700;font-size:14px;min-height:38px;display:flex;align-items:center;gap:8px}
.grp{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.gname{font-size:12px;color:var(--muted)}
.ansrow{display:flex;gap:8px}
.ansrow input{flex:1}
.num{font-variant-numeric:tabular-nums}
@media (hover:hover){
  .btn:hover,.chip:hover,.opt:hover{border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08)}
}
/* very narrow phones */
@media (max-width:359px){
  h1{font-size:22px}
  .opts{gap:5px}
  .opt{padding-inline:2px}
  .btn.big{font-size:16px;padding:14px}
}
/* tablet and up */
@media (min-width:760px){
  body{font-size:16px;padding-block:28px 48px}
  :root{--kfs:min(40px,5.2vh);--ofs:min(24px,3.2vh)}
  main{max-width:700px;gap:18px}
  main.home{max-width:920px}
  main.home .home-grid{grid-template-columns:1fr 1fr;align-items:start;gap:18px}
  main.home .modes{grid-template-columns:1fr 1fr;gap:18px}
  h1{font-size:32px}
  .card{padding:20px}
  .kami{padding:28px 16px}
  .opts{gap:14px}
  .opt{padding:16px 6px}
  .poemfull .j{font-size:19px}
  .big-score{font-size:56px}
}
@media (min-width:1100px){
  :root{--kfs:min(46px,5.4vh);--ofs:min(26px,3.3vh)}
  main{max-width:760px}
  main.home{max-width:1020px}
}
/* wide screens and sideways phones: poem on the left, choices and result on the right */
@media (min-width:900px), (orientation:landscape) and (max-height:520px){
  main.quiz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:18px;row-gap:12px;align-items:start;max-width:1000px}
  main.quiz>*{min-width:0}
  main.quiz>.prog{grid-column:1/-1}
  main.quiz>.kami{grid-column:1;grid-row:2 / span 3;align-self:stretch}
  main.quiz>.opts,main.quiz>#fb,main.quiz>.ta{grid-column:2}
}
/* phone held sideways: little height, plenty of width */
@media (orientation:landscape) and (max-height:520px){
  body{padding-block:8px 16px}
  :root{--kfs:min(7vh,28px);--ofs:min(4.4vh,18px)}
  main{gap:8px}
  main.quiz{row-gap:8px}
  .card{padding:12px}
  .kami{padding:12px 8px}
  .btn.big{padding:12px}
  .poemfull .j{font-size:15px}
}

/* time attack */
.ta{display:flex;flex-direction:column;gap:4px}
.ta .bar{flex:none;width:100%}
.ta .bar i{transition:width .1s linear}
.ta.over .bar i{background:var(--ng)}
.ta.over .note{color:var(--ng);font-weight:700}
.opt.hint{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent);animation:hintpulse 1s ease-in-out infinite}
@keyframes hintpulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}}
@media (prefers-reduced-motion: reduce){.opt.hint{animation:none}}
/* marks */
.markbar{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.mk{font:inherit;font-size:18px;line-height:1;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;color:var(--mkc)}
.mk1{--mkc:#c98600}.mk2{--mkc:#d6455d}.mk3{--mkc:#2f86c4}.mk4{--mkc:#2f9a58}
.mk[aria-pressed="true"]{background:var(--mkc);color:#fff;border-color:var(--mkc)}
.mk.chipmk{width:auto;padding:0 12px;font-size:15px}
/* pair mode */
main.pairview{max-width:720px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:10px}
.pcol h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600;text-align:center}
.pcol{display:flex;flex-direction:column;gap:8px}
.pc{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 4px;cursor:pointer;display:flex;justify-content:center;align-items:flex-start;min-height:calc(var(--pfs)*9.3 + 24px);height:calc(var(--pfs)*9.3 + 24px);width:100%;position:relative}
.pc{--F:var(--pfs)}.pc .vert{line-height:1.3;letter-spacing:.02em}
.pc.down{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 8px,var(--line) 8px,var(--line) 9px);align-items:center;color:var(--muted)}
.pc.down .back{font-size:13px;letter-spacing:.1em}
.pc.empty{visibility:hidden;cursor:default}
.pc.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pc.done{opacity:.45;cursor:default;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.pc.bad{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 14%,var(--paper));animation:pshake .3s}
.pc.flip{animation:pflip .25s}
@keyframes pflip{from{transform:rotateY(90deg)}to{transform:none}}
@keyframes pshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
:root{--pfs:clamp(13px,min(4vw,3vh),22px)}
@media (min-width:760px){:root{--pfs:min(26px,3.6vh)}}
@media (prefers-reduced-motion: reduce){.pc.flip,.pc.bad{animation:none}}
@media (prefers-reduced-motion: reduce){.c{transition:none}}

</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
'use strict';

/* ---------- fixed reference tables (poem number -> poet, season/theme) ---------- */
var GENRE_GROUPS=[
 {k:'a',name:'季節',tags:['春','夏','秋','冬']},
 {k:'b',name:'部立て',tags:['恋','旅','別れ','雑']},
 {k:'c',name:'動物',tags:['虫','鳥','動物']},
 {k:'d',name:'植物',tags:['植物','桜']},
 {k:'e',name:'気象',tags:['気象']},
 {k:'f',name:'自然',tags:['自然','月']},
 {k:'g',name:'人物',tags:['人物']},
 {k:'h',name:'事物',tags:['事物','衣']},
 {k:'i',name:'時刻',tags:['明け方','朝','夕方','夜']},
 {k:'j',name:'歌枕・地名',tags:['地名']}

var GENRE_SET={};
GENRE_GROUPS.forEach(function(g){g.tags.forEach(function(t){GENRE_SET[t]=1})});
var GENRE_ALIAS={'離別':'別れ','別離':'別れ'};
var EMOTIONS=['スゴイ！キレイ！','さびしい','すき！','かなしい','しみじみ','悩み・苦しみ','怒り'];
var EMO_ALIAS={'すごいきれい':0,'すごい':0,'きれい':0,'さびしい':1,'寂しい':1,'すき':2,'好き':2,'かなしい':3,'悲しい':3,'しみじみ':4,'悩み苦しみ':5,'悩み':5,'苦しみ':5,'なやみ':5,'怒り':6,'いかり':6};
var AUTHORS=['天智天皇','持統天皇','柿本人麻呂','山部赤人','猿丸大夫','中納言家持','阿倍仲麻呂','喜撰法師','小野小町','蝉丸',
'参議篁','僧正遍昭','陽成院','河原左大臣','光孝天皇','中納言行平','在原業平朝臣','藤原敏行朝臣','伊勢','元良親王',
'素性法師','文屋康秀','大江千里','菅家','三条右大臣','貞信公','中納言兼輔','源宗于朝臣','凡河内躬恒','壬生忠岑',
'坂上是則','春道列樹','紀友則','藤原興風','紀貫之','清原深養父','文屋朝康','右近','参議等','平兼盛',
'壬生忠見','清原元輔','権中納言敦忠','中納言朝忠','謙徳公','曽禰好忠','恵慶法師','源重之','大中臣能宣朝臣','藤原義孝',
'藤原実方朝臣','藤原道信朝臣','右大将道綱母','儀同三司母','大納言公任','和泉式部','紫式部','大弐三位','赤染衛門','小式部内侍',
'伊勢大輔','清少納言','左京大夫道雅','権中納言定頼','相模','前大僧正行尊','周防内侍','三条院','能因法師','良暹法師',
'大納言経信','祐子内親王家紀伊','権中納言匡房','源俊頼朝臣','藤原基俊','法性寺入道前関白太政大臣','崇徳院','源兼昌','左京大夫顕輔','待賢門院堀河',
'後徳大寺左大臣','道因法師','皇太后宮大夫俊成','藤原清輔朝臣','俊恵法師','西行法師','寂蓮法師','皇嘉門院別当','式子内親王','殷富門院大輔',
'後京極摂政前太政大臣','二条院讃岐','鎌倉右大臣','参議雅経','前大僧正慈円','入道前太政大臣','権中納言定家','従二位家隆','後鳥羽院','順徳院'];
var GENRES=['秋','夏','恋','冬','秋','冬','旅','雑','春','雑',
'旅','雑','恋','恋','春','離別','秋','恋','恋','恋',
'恋','秋','秋','旅','恋','秋','恋','冬','秋','恋',
'冬','秋','春','雑','春','夏','秋','恋','恋','恋',
'恋','恋','恋','恋','恋','恋','秋','恋','恋','恋',
'恋','恋','恋','恋','雑','恋','雑','恋','恋','雑',
'春','雑','恋','冬','恋','春','春','雑','秋','秋',
'秋','恋','春','恋','雑','雑','恋','冬','秋','恋',
'夏','恋','雑','雑','恋','恋','秋','恋','恋','恋',
'秋','恋','旅','秋','雑','春','恋','夏','雑','雑'];

/* ---------- demo data: original verses written for testing, NOT from the anthology ---------- */
var DEMO=[
 {no:1,genre:'春',author:'デモ(オリジナル)',kami:'はるのあめ やねをならして ふりやまず',kamiKana:'はるのあめ やねをならして ふりやまず',shimo:'まどのさくらは ひらきはじめぬ',shimoKana:'まどのさくらは ひらきはじめぬ'},
 {no:2,genre:'夏',author:'デモ(オリジナル)',kami:'なつのよる ほたるのひかり ゆれながら',kamiKana:'なつのよる ほたるのひかり ゆれながら',shimo:'かわのながれに ほしをうつしぬ',shimoKana:'かわのながれに ほしをうつしぬ'},
 {no:3,genre:'秋',author:'デモ(オリジナル)',kami:'あきのかぜ ふくやまみちに おちばしき',kamiKana:'あきのかぜ ふくやまみちに おちばしき',shimo:'ひとりあるけば ことりのなくね',shimoKana:'ひとりあるけば ことりのなくね'},
 {no:4,genre:'冬',author:'デモ(オリジナル)',kami:'ふゆのあさ こおりのはしら とけはじめ',kamiKana:'ふゆのあさ こおりのはしら とけはじめ',shimo:'のきのしずくが おとをたてけり',shimoKana:'のきのしずくが おとをたてけり'},
 {no:5,genre:'恋',author:'デモ(オリジナル)',kami:'ひさしぶり ともとかたりし ゆうぐれに',kamiKana:'ひさしぶり ともとかたりし ゆうぐれに',shimo:'つきがのぼるを ふたりでみてた',shimoKana:'つきがのぼるを ふたりでみてた'}
];

function fixPoem(p){
  if(!Array.isArray(p.genres)){
    p.genres=p.genre?[GENRE_ALIAS[p.genre]||String(p.genre)]:[];
  }
  if(!Array.isArray(p.feelings))p.feelings=[];
  return p;
}
DEMO.forEach(fixPoem);
DEMO[0].genres=['春','桜'];DEMO[0].feelings=['スゴイ！キレイ！'];
DEMO[1].genres=['夏','虫','夜'];DEMO[1].feelings=['しみじみ'];
DEMO[2].genres=['秋','鳥'];DEMO[2].feelings=['さびしい'];
DEMO[3].genres=['冬','朝'];DEMO[3].feelings=['しみじみ'];
DEMO[4].genres=['恋','夕方','月'];DEMO[4].feelings=['すき！'];

/* ---------- storage helpers ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

var $app=document.getElementById('app');
var data=loadData();
var S=loadSettings();
/* 苦手マーク: 歌番号 -> 1〜4 */
var MARKS=[{id:1,sym:'★',name:'星'},{id:2,sym:'♥',name:'ハート'},{id:3,sym:'◆',name:'ひし形'},{id:4,sym:'▲',name:'三角'}];
var M=(function(){var o={};try{var r=JSON.parse(lsGet('hyakunin_marks_v1')||'{}');for(var k in r){var v=r[k];if(v>=1&&v<=4&&v===Math.floor(v)&&/^\d+$/.test(k))o[k]=v}}catch(e){}return o})();
function saveMarks(){lsSet('hyakunin_marks_v1',JSON.stringify(M))}
function markBar(p){
  return '<div class="markbar" role="group" aria-label="苦手マーク"><span class="note" style="margin:0">苦手マーク</span>'+MARKS.map(function(m){
    return '<button class="mk mk'+m.id+'" data-act="mark" data-no="'+p.no+'" data-m="'+m.id+'" aria-pressed="'+(M[p.no]===m.id)+'" aria-label="'+m.name+'のマーク">'+m.sym+'</button>'}).join('')+'</div>';
}
var timer=null, Q=null;

function loadData(){
  var raw=lsGet('hyakunin_data_v1');
  if(raw){try{var d=JSON.parse(raw);if(Array.isArray(d)&&d.length>=4)return d.map(fixPoem)}catch(e){}}
  return DEMO.slice();
}
function isDemo(){return data.length&&data[0].author==='デモ(オリジナル)'}
function loadSettings(){
  var d={from:1,to:100,tags:[],feel:[],speed:0.8,scriptK:'kana',scriptS:'kana',count:'all',kimari:true,pairHide:'kami',nsheet:[],kjlen:[],marks:[],fill4:true,confuse:true,target:5};
  var raw=lsGet('hyakunin_settings_v1');
  if(raw){try{var s=JSON.parse(raw);for(var k in d){if(s[k]!==undefined)d[k]=s[k]}
    if(s.script&&s.scriptK===undefined&&s.scriptS===undefined){d.scriptK=d.scriptS=(s.script==='kanji'?'kanji':'kana')}}catch(e){}}
  d.target=(typeof d.target==='number'&&d.target>=1&&d.target<=60)?d.target:5;d.fill4=d.fill4!==false;d.confuse=d.confuse!==false;
  d.marks=Array.isArray(d.marks)?d.marks.filter(function(x){return x>=1&&x<=4&&x===Math.floor(x)}):[];
  d.kjlen=Array.isArray(d.kjlen)?d.kjlen.filter(function(x){return typeof x==='number'&&isFinite(x)}):[];
  d.nsheet=Array.isArray(d.nsheet)?d.nsheet.filter(function(x){return typeof x==='number'&&isFinite(x)}):[];
  d.scriptK=d.scriptK==='kanji'?'kanji':'kana';d.scriptS=d.scriptS==='kanji'?'kanji':'kana';
  return d;
}

/* ---------- text helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toHira(s){return s.replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60)})}
var SAME={'を':'お','ゐ':'い','ゑ':'え','ぢ':'じ','づ':'ず','は':'わ','ひ':'い','ふ':'う','へ':'え','ほ':'お'};
function norm(s){
  s=toHira(String(s).normalize('NFKC')).replace(/[\s、。・,.!?「」ー]/g,'');
  var out='';
  for(var i=0;i<s.length;i++){out+=SAME[s[i]]||s[i]}
  return out;
}
function moras(s){
  var r=[];
  for(var ch of s){
    if(/[ゃゅょぁぃぅぇぉゎ]/.test(ch)&&r.length)r[r.length-1]+=ch;else r.push(ch);
  }
  return r;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* phrases(p,'kami') -> array of arrays of display units */
function phrases(p,part){
  var lens=part==='kami'?[5,7,5]:[7,7];
  var kj=(part==='kami'?S.scriptK:S.scriptS)==='kanji';
  var t=kj?p[part]:p[part+'Kana'];
  if(kj&&!/[\s　]/.test(t))t=p[part+'Kana'];
  var useMora=(t===p[part+'Kana']);
  var parts;
  if(/[\s　]/.test(t.trim())){
    parts=t.trim().split(/[\s　]+/);
  }else{
    var u=moras(t),sum=lens.reduce(function(a,b){return a+b},0);
    if(u.length===sum){parts=[];var pos=0;lens.forEach(function(n){parts.push(u.slice(pos,pos+n).join(''));pos+=n})}
    else if(u.length>lens[0]){parts=[];var pos2=0,cum=0;lens.forEach(function(n,k){cum+=n;var end=k===lens.length-1?u.length:Math.round(cum*u.length/sum);parts.push(u.slice(pos2,end).join(''));pos2=end})}
    else parts=[t];
  }
  return parts.map(function(ph){return useMora?moras(ph):Array.from(ph)});
}
function plainText(p,part,kana){
  var t=kana?p[part+'Kana']:p[part];
  return t.trim().replace(/[\s　]+/g,' ');
}
var GS=1,GSkey=null,GSdata=null;
/* 全部の歌で字の大きさをそろえる: いちばん字余りの句に合わせた共通の倍率 */
function globalScale(){
  var key=S.scriptK+'|'+S.scriptS;
  if(GSdata!==data||GSkey!==key){
    var mx=8;
    data.forEach(function(p){['kami','shimo'].forEach(function(part){
      var tot=0;phrases(p,part).forEach(function(l,k){tot=Math.max(tot,k+l.length)});mx=Math.max(mx,tot);
    })});
    GS=8/mx;GSdata=data;GSkey=key;
  }
  return GS;
}
function vertHTML(ph,withSpans){
  var i=0,sc=globalScale();
  return '<div class="vert" style="--sc:'+sc.toFixed(3)+'">'+ph.map(function(line,k){
    return '<div class="ph" style="--o:'+k+'">'+line.map(function(c){
      return withSpans?'<span class="c" data-i="'+(i++)+'">'+esc(c)+'</span>':esc(c);
    }).join('')+'</div>';
  }).join('')+'</div>';
}
function unitCount(ph){return ph.reduce(function(a,l){return a+l.length},0)}

/* ---------- selection ---------- */
var GI=null,GIdata=null;
function firstKana(p){return toHira(String(p.kamiKana).trim()).charAt(0)}
function groupInfo(){
  if(GIdata!==data){
    var by={};data.forEach(function(p){var k=firstKana(p);by[k]=(by[k]||0)+1});
    var sizes={};Object.keys(by).forEach(function(k){(sizes[by[k]]=sizes[by[k]]||[]).push(k)});
    GI={by:by,sizes:sizes};GIdata=data;
  }
  return GI;
}
function pool(){
  var gi=groupInfo();
  var anyOf=function(have,want){return !want.length||have.some(function(x){return want.indexOf(x)>=0})};
  return data.filter(function(p){return p.no>=S.from&&p.no<=S.to&&anyOf(p.genres,S.tags)&&anyOf(p.feelings,S.feel)&&(!S.nsheet.length||S.nsheet.indexOf(gi.by[firstKana(p)])>=0)&&(!S.kjlen.length||S.kjlen.indexOf(kimariji(p))>=0)&&(!S.marks.length||S.marks.indexOf(M[p.no])>=0)});
}

/* CSV parser: quoted fields, escaped quotes, CRLF, BOM. Tab is used when a line has tabs but no commas. */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  var first=text.split(/\r?\n/)[0]||'';
  var d=(first.indexOf('\t')>=0&&first.indexOf(',')<0)?'\t':',';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){
      if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}
      else cur+=ch;
    }else if(ch==='"'&&cur===''){q=true}
    else if(ch===d){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&text[i+1]==='\n')i++;
      row.push(cur);cur='';rows.push(row);row=[];
    }else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(function(r){return r.some(function(c){return c.trim()!==''})});
}
function splitCell(s){return String(s||'').split(/[\s　\/／、;；|,，]+/).filter(Boolean)}
function emoKey(s){return toHira(String(s).replace(/[！!・\s　]/g,''))}
function isHira(s){return /^[ぁ-ゖー\s　]+$/.test(s)}
var PH_LENS=[5,7,5,7,7],PH_NAMES=['初句','二句','三句','四句','五句'];
function squash(s){return String(s||'').replace(/[\s　]+/g,'')}
function parseImport(text){
  text=text.trim();
  var errors=[],warns=[],out=[],seen={};
  var table=parseCSV(text);
  var col=null,start=0;
  if(table.length&&!/\d/.test(String(table[0][0]).normalize('NFKC'))){
    start=1;
    var m={p:[],k:[],gc:[]};
    table[0].forEach(function(h,i){
      h=h.trim();
      var isK=/よみ|読み|かな/.test(h),pi=-1;
      if(/初句|一句|第1句|第一句/.test(h))pi=0;
      else if(/二句|第2句|第二句/.test(h))pi=1;
      else if(/三句|第3句|第三句/.test(h))pi=2;
      else if(/四句|第4句|第四句/.test(h))pi=3;
      else if(/五句|第5句|第五句/.test(h))pi=4;
      if(/番号|^no$/i.test(h))m.no=i;
      else if(/ジャンル|分類/.test(h))m.gc.push(i);
      else if(/気持ち|感情/.test(h))m.feel=i;
      else if(pi>=0){(isK?m.k:m.p)[pi]=i}
      else if(/^上/.test(h)){if(isK)m.kamiKana=i;else m.kami=i}
      else if(/^下/.test(h)){if(isK)m.shimoKana=i;else m.shimo=i}
    });
    var hasPh=[0,1,2,3,4].every(function(i){return m.k[i]!==undefined});
    if(m.no!==undefined&&hasPh)col={mode:'phrase',m:m};
    else if(m.no!==undefined&&m.kamiKana!==undefined&&m.shimoKana!==undefined)col={mode:'two',m:m};
  }
  function cell(c,i){return i===undefined?'':(c[i]||'')}
  for(var ri=start;ri<table.length;ri++){
    var c=table[ri].map(function(x){return x.trim()});
    var ln=ri+1,r=null,n=c.length;
    while(n&&c[n-1]==='')n--;
    if(!n)continue;
    if(col&&col.mode==='phrase'){
      var mm=col.m,pk=[],pj=[];
      for(var q=0;q<5;q++){var kq=squash(cell(c,mm.k[q]));pk.push(kq);pj.push(squash(cell(c,mm.p[q]))||kq)}
      r={no:cell(c,mm.no),ph:pj,phK:pk,genre:mm.gc.length?mm.gc.map(function(i){return cell(c,i)}).join(' '):null,feel:cell(c,mm.feel)};
    }else if(col&&col.mode==='two'){
      var m2=col.m;
      r={no:cell(c,m2.no),kami:cell(c,m2.kami!==undefined?m2.kami:m2.kamiKana),kamiKana:cell(c,m2.kamiKana),
        shimo:cell(c,m2.shimo!==undefined?m2.shimo:m2.shimoKana),shimoKana:cell(c,m2.shimoKana),
        genre:m2.gc.length?m2.gc.map(function(i){return cell(c,i)}).join(' '):null,feel:cell(c,m2.feel)};
    }else if(n>=11){
      var gNew=n>=14;
      r={no:c[0],ph:c.slice(1,6).map(squash),phK:c.slice(6,11).map(squash),genre:n>=12?(gNew?c.slice(11,17).join(' '):c[11]):null,feel:gNew?(c[17]||''):(c[12]||'')};
      for(var z=0;z<5;z++)if(!r.ph[z])r.ph[z]=r.phK[z];
    }else if(n>=5&&n<=7){
      r={no:c[0],kami:c[1],kamiKana:c[2],shimo:c[3],shimoKana:c[4],genre:n>=6?c[5]:null,feel:c[6]||''};
    }else if(n===3){
      r={no:c[0],kami:c[1],kamiKana:c[1],shimo:c[2],shimoKana:c[2],genre:null,feel:''};
    }else{errors.push(ln+'行目: 列の数が合いません');continue}
    var no=parseInt(String(r.no||'').normalize('NFKC').replace(/\D/g,''),10);
    if(!no||no<1||no>100){errors.push(ln+'行目: 番号が1〜100ではありません');continue}
    var kami,kamiK,shimo,shimoK;
    if(r.ph){
      var emptyAt=-1;
      for(var e=0;e<5;e++)if(!r.phK[e]||!r.ph[e]){emptyAt=e;break}
      if(emptyAt>=0){errors.push(no+'番: '+PH_NAMES[emptyAt]+'が空です');continue}
      r.phK=r.phK.map(toHira);
      var badAt=-1;
      for(var b=0;b<5;b++)if(!isHira(r.phK[b])){badAt=b;break}
      if(badAt>=0){errors.push(no+'番: '+PH_NAMES[badAt]+'の読みにひらがな以外が含まれています');continue}
      for(var w=0;w<5;w++){var mc=moras(r.phK[w]).length;if(mc!==PH_LENS[w])warns.push(no+'番: '+PH_NAMES[w]+'の読みが'+mc+'音です('+PH_LENS[w]+'音のはず)')}
      kami=r.ph.slice(0,3).join(' ');kamiK=r.phK.slice(0,3).join(' ');
      shimo=r.ph.slice(3).join(' ');shimoK=r.phK.slice(3).join(' ');
    }else{
      kami=String(r.kami||'').trim();shimo=String(r.shimo||'').trim();
      kamiK=toHira(String(r.kamiKana||'')).trim();shimoK=toHira(String(r.shimoKana||'')).trim();
      if(!kami||!shimo||!kamiK||!shimoK){errors.push(no+'番: 空の欄があります');continue}
      if(!isHira(kamiK)||!isHira(shimoK)){errors.push(no+'番: 読みにひらがな以外が含まれています');continue}
    }
    if(seen[no]){errors.push(no+'番: 重複しています');continue}
    seen[no]=1;
    var gens=[],feels=[];
    if(r.genre===null){
      var d0=GENRES[no-1];gens=[GENRE_ALIAS[d0]||d0];
    }else{
      splitCell(r.genre).forEach(function(t){
        t=GENRE_ALIAS[t]||t;
        if(GENRE_SET[t]){if(gens.indexOf(t)<0)gens.push(t)}
        else warns.push(no+'番: 未対応のジャンル名「'+t+'」');
      });
    }
    splitCell(r.feel).forEach(function(t){
      var k=EMO_ALIAS[emoKey(t)];
      if(k===undefined)warns.push(no+'番: 未対応の気持ち「'+t+'」');
      else if(feels.indexOf(EMOTIONS[k])<0)feels.push(EMOTIONS[k]);
    });
    if(gens.length>6){warns.push(no+'番: ジャンルは6つまでです(先頭の6つだけ使います)');gens=gens.slice(0,6)}
    if(feels.length>1){warns.push(no+'番: 気持ちは1つだけです(先頭の「'+feels[0]+'」だけ使います)');feels=feels.slice(0,1)}
    out.push({no:no,genres:gens,feelings:feels,author:AUTHORS[no-1],kami:kami,kamiKana:kamiK,shimo:shimo,shimoKana:shimoK});
  }
  out.sort(function(a,b){return a.no-b.no});
  return {out:out,errors:errors,warns:warns};
}

/* ---------- kimariji: shortest opening that no other loaded poem shares ---------- */
var KC=null,KCdata=null;
function kimariji(p){
  if(KCdata!==data){
    KC={};
    var arr=data.map(function(q){return {no:q.no,m:moras(squash(q.kamiKana))}});
    arr.forEach(function(a){
      var k=a.m.length;
      for(var n=1;n<=a.m.length;n++){
        var pre=a.m.slice(0,n).join('');
        var clash=arr.some(function(b){return b.no!==a.no&&b.m.length>=n&&b.m.slice(0,n).join('')===pre});
        if(!clash){k=n;break}
      }
      KC[a.no]=k;
    });
    KCdata=data;
  }
  return KC[p.no]||moras(squash(p.kamiKana)).length;
}
function kimarijiText(p){return moras(squash(p.kamiKana)).slice(0,kimariji(p)).join('')}

/* ---------- quiz ---------- */
/* 4択の選択肢: 上の句や下の句の出だしが同じ歌(紛らわしい札)を優先して混ぜる */
function lcpMoras(a,b){var x=moras(squash(a)),y=moras(squash(b)),n=0;while(n<x.length&&n<y.length&&x[n]===y[n])n++;return n}
function pickDistractors(p){
  var rest=shuffle(data.filter(function(x){return x.no!==p.no}));
  if(S.confuse===false)return rest.slice(0,3);
  var scored=rest.map(function(x){return {x:x,sc:Math.max(lcpMoras(p.kamiKana,x.kamiKana),lcpMoras(p.shimoKana,x.shimoKana))}});
  var sim=scored.filter(function(o){return o.sc>=2}).sort(function(a,b){return b.sc-a.sc}).slice(0,2).map(function(o){return o.x});
  var out=sim.slice();
  rest.forEach(function(x){if(out.length<3&&out.indexOf(x)<0)out.push(x)});
  return out;
}
var taTimer=null;
function stopTA(){if(taTimer){clearInterval(taTimer);taTimer=null}}
/* タイムアタック: 目標時間を過ぎたら正解の選択肢を光らせる */
function startTA(){
  stopTA();Q.t0=Date.now();
  var q=Q;
  var upd=function(){
    if(!Q||Q!==q||Q.stage==='done'||!Q.active){stopTA();return}
    var el=(Date.now()-Q.t0)/1000,T=Q.target;
    var bar=document.getElementById('tabar'),tx=document.getElementById('tatxt');
    if(bar)bar.style.width=Math.min(100,el/T*100)+'%';
    if(el>=T){
      if(tx)tx.textContent='目標時間を過ぎました';
      var cur=Q.list[Q.i];
      document.querySelectorAll('.opt').forEach(function(b,i){if(Q.opts&&Q.opts[i]&&Q.opts[i].no===cur.no)b.classList.add('hint')});
      var wrap=document.getElementById('tabox');if(wrap)wrap.classList.add('over');
    }else if(tx)tx.textContent='目標 '+T+'秒 ／ 残り '+Math.max(0,T-el).toFixed(1)+'秒';
  };
  taTimer=setInterval(upd,100);upd();
}
function startQuiz(mode,list,attack){
  stopTimer();stopTA();
  Q={attack:!!attack,target:S.target,t0:0,mode:mode,list:list,i:0,recs:[],answered:false,rev:0,total:0,opts:null,stage:'ask',active:true,nextOkAt:0,more:false,gaveUp:false,pauseAt:0,kim:0,tick:null,kimari:S.kimari!==false};
  showQ();
}
function makeList(){
  var l=shuffle(pool());
  if(S.count!=='all')l=l.slice(0,parseInt(S.count,10));
  return l;
}
function showQ(){
  $app.className='quiz';
  var p=Q.list[Q.i];
  var kp=phrases(p,'kami');
  Q.total=unitCount(kp);Q.rev=0;Q.answered=false;Q.stage='ask';Q.more=false;Q.gaveUp=false;
  Q.kim=kimariji(p);
  /* where the poem pauses. Kana display: exactly the kimariji. Kanji display: kana count cannot be mapped one-to-one, so scale proportionally and round up */
  var dispKana=kp.map(function(l){return l.join('')}).join('')===squash(p.kamiKana);
  var kanaLen=Math.max(1,moras(squash(p.kamiKana)).length);
  Q.pauseAt=Q.kimari?Math.max(1,Math.min(Q.total,dispKana?Q.kim:Math.ceil(Q.kim/kanaLen*Q.total))):Q.total;
  var h='<div class="prog"><span class="num">'+(Q.i+1)+' / '+Q.list.length+'</span><div class="bar"><i style="width:'+(Q.i/Q.list.length*100)+'%"></i></div><button class="btn small" data-act="quit">やめる</button></div>';
  if(Q.attack)h+='<div class="ta" id="tabox"><span id="tatxt" class="note" style="margin:0"></span><div class="bar"><i id="tabar"></i></div></div>';
  h+='<div class="kami" id="kami">'+vertHTML(kp,true)+'</div>';
  if(Q.mode==='choice'){
    var others=pickDistractors(p);
    Q.opts=shuffle([p].concat(others));
    h+='<div class="opts" id="opts">'+Q.opts.map(function(o,k){
      return '<button class="opt" data-act="pick" data-k="'+k+'" aria-label="選択肢'+(k+1)+'">'+vertHTML(phrases(o,'shimo'),false)+'</button>';
    }).join('')+'</div>';
    h+='<div id="fb"></div>';
  }else{
    h+=Q.kimari?'<div id="fb"><p class="note" style="margin:0;text-align:center">決まり字まで表示します</p></div>':'<div id="fb"><button class="btn primary big" data-act="wakatta">わかった</button></div>';
  }
  $app.innerHTML=h;
  var tick=function(){
    if(Q.stage==='input'||Q.stage==='paused'||Q.stage==='done'){stopTimer();return}
    var limit=(Q.kimari&&Q.stage==='ask')?Q.pauseAt:Q.total;
    if(Q.rev<limit){
      var el=document.querySelector('.c[data-i="'+Q.rev+'"]');
      if(el)el.classList.add('on');
      Q.rev++;
    }
    if(Q.rev>=limit){
      stopTimer();
      if(Q.kimari&&Q.stage==='ask')enterPause();
    }
  };
  Q.tick=tick;
  if(Q.attack)startTA();
  setTimeout(function(){if(Q&&!Q.answered&&Q.stage==='ask'&&!timer){timer=setInterval(tick,Math.max(100,S.speed*1000));tick()}},350);
}
function freezeKami(keepHidden){
  stopTimer();
  if(keepHidden)return; /* leave unrevealed characters fully hidden */
  document.querySelectorAll('.c').forEach(function(el){
    var i=parseInt(el.dataset.i,10);
    el.classList.add('on');
    if(i>=Q.rev)el.classList.add('late');
  });
}
function fullPoem(p){
  return '<div class="poemfull"><div class="j">'+esc(plainText(p,'kami',false))+'</div><div class="j">'+esc(plainText(p,'shimo',false))+'</div>'+
    '<div class="r">'+esc(plainText(p,'kami',true))+' / '+esc(plainText(p,'shimo',true))+'</div>'+
    '<div class="a">'+(isDemo()?'':'<span class="num">'+p.no+'</span>番　')+esc(p.author)+'</div>'+
    '<div class="note">決まり字: <strong style="color:var(--ink)">'+esc(kimarijiText(p))+'</strong>('+kimariji(p)+'文字)'+(data.length<100?'　※読み込んだ歌のなかでの判定':'')+'</div>'+
    ((p.genres.length||p.feelings.length)?'<div class="note">'+(p.genres.length?'ジャンル: '+esc(p.genres.join('・')):'')+(p.genres.length&&p.feelings.length?'　':'')+(p.feelings.length?'気持ち: '+esc(p.feelings.join('・')):'')+'</div>':'')+markBar(p)+'</div>';
}
function feedback(ok,extra){
  var p=Q.list[Q.i],last=Q.i>=Q.list.length-1;
  var shown;
  var upto=Q.rev===0?'1文字も出る前':(Q.rev>=Q.total?'最後まで見て':Q.rev+'文字目で');
  if(Q.gaveUp)shown='「わからない」を選びました';
  else if(Q.kimari){
    if(Q.more)shown='決まり字のあと、'+upto+'答えた';
    else if(Q.rev<Q.pauseAt)shown=upto+'答えた(決まり字より前)';
    else shown='決まり字までで答えた';
  }else{
    shown=upto+(Q.mode==='choice'?'答えた':'止めた');
  }
  var h='<div class="card fb"><div class="row"><span class="mark '+(ok?'ok':'ng')+'" aria-hidden="true">'+(ok?'○':'×')+'</span><div><strong>'+(ok?'正解':'不正解')+'</strong><div class="note">'+shown+'</div></div></div>'+(extra||'')+fullPoem(p)+(Q.mode==='choice'?'<p class="note" style="margin:0;text-align:center">画面のどこかをタップすると次へ進みます</p>':'')+
    '<button class="btn primary big" data-act="next" id="nextBtn">'+(last?'結果を見る':'次の歌へ')+'</button></div>';
  document.getElementById('fb').innerHTML=h;
  var nb=document.getElementById('nextBtn');if(nb)nb.focus({preventScroll:true});
}
function pick(k){
  if(Q.answered)return;
  Q.answered=true;Q.stage='done';Q.nextOkAt=Date.now()+400;
  var p=Q.list[Q.i];
  freezeKami();
  var ok=Q.opts[k].no===p.no;
  var btns=document.querySelectorAll('.opt');
  btns.forEach(function(b,i){
    b.setAttribute('aria-disabled','true');
    if(Q.opts[i].no===p.no)b.classList.add('correct');
    else if(i===k)b.classList.add('wrong');
  });
  var ms=Q.attack?Date.now()-Q.t0:0;stopTA();
  Q.recs.push({p:p,ok:ok,shown:Q.rev,more:Q.more,ms:ms,inTime:Q.attack&&ms<=Q.target*1000});
  feedback(ok,Q.attack?'<div class="note">解答時間 <strong style="color:var(--ink)">'+(ms/1000).toFixed(1)+'</strong>秒(目標 '+Q.target+'秒)'+(ms<=Q.target*1000?'　目標内':'　目標超過')+'</div>':'');
}
function enterPause(){
  if(Q.stage!=='ask')return;
  if(Q.mode==='fill'){enterInput(false);return}
  Q.stage='paused';
  var all=Q.rev>=Q.total;
  document.getElementById('fb').innerHTML='<div class="card fb"><p class="note" id="pnote" style="margin:0">'+(all?'上の句をすべて表示しました。':'決まり字まで表示しました。')+'分かったら、下の句の選択肢をタップしてください。</p>'+
    (all?'':'<button class="btn" style="width:100%" data-act="dontknow" id="dkBtn">わからない(続きを表示)</button>')+'</div>';
}
function enterInput(manual){
  if(Q.stage!=='ask')return;
  Q.stage='input';
  if(manual)freezeKami(true); /* 「わかった」: stop now and keep the rest hidden */
  var all=Q.rev>=Q.total;
  document.getElementById('fb').innerHTML='<div class="card fb">'+
    (manual?'':'<p class="note" id="pnote" style="margin:0">'+(all?'上の句をすべて表示しました。':'決まり字まで表示しました。')+'</p>')+
    '<label class="f" for="ans">下の句をひらがなで入力'+(S.fill4!==false?'(四句だけでも正解)':'')+'</label>'+
    '<div class="ansrow"><input type="text" id="ans" lang="ja" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ひらがな"><button class="btn primary" data-act="submit">答える</button></div>'+
    (manual?(all?'':'<button class="btn" style="width:100%" data-act="cancelans">キャンセルして続きを表示</button>'):'<button class="btn" style="width:100%" data-act="'+(all?'giveup':'dontknow')+'" id="dkBtn">'+(all?'降参して答えを見る':'わからない(続きを表示)')+'</button>')+
    '<p class="note" style="margin:0">「は」と「わ」、「へ」と「え」など同じ音は区別せずに判定します。</p></div>';
  var a=document.getElementById('ans');if(a)a.focus({preventScroll:true});
}
function wakatta(){
  if(Q.stage!=='ask'||Q.kimari)return;
  enterInput(true);
}
/* 「わかった」を取り消して、残りの字の表示を再開する */
function cancelAnswer(){
  if(Q.stage!=='input'||Q.mode!=='fill'||Q.kimari||Q.rev>=Q.total)return;
  Q.stage='ask';
  var fb=document.getElementById('fb');
  if(fb)fb.innerHTML='<button class="btn primary big" data-act="wakatta">わかった</button>';
  stopTimer();
  timer=setInterval(Q.tick,Math.max(100,S.speed*1000));
  Q.tick();
}
function dontknow(){
  if(Q.stage!=='input'&&Q.stage!=='paused')return;
  if(Q.stage==='input'&&Q.rev>=Q.total)return giveUp();
  var choice=Q.mode==='choice';
  Q.stage='more';Q.more=true;
  var b=document.getElementById('dkBtn'),pn=document.getElementById('pnote');
  if(choice){
    if(b)b.remove();
    if(pn)pn.textContent='続きを表示しています。分かったら、下の句の選択肢をタップしてください。';
  }else{
    if(b){b.setAttribute('data-act','giveup');b.textContent='降参して答えを見る'}
    if(pn)pn.textContent='続きを表示しています。分かったら、いつでも入力して答えられます。';
  }
  stopTimer();
  timer=setInterval(Q.tick,Math.max(100,S.speed*1000));
  Q.tick();
}
function giveUp(){
  if(Q.stage!=='input'&&Q.stage!=='more')return;
  Q.stage='done';Q.answered=true;Q.gaveUp=true;
  freezeKami(false);
  var p=Q.list[Q.i];
  Q.recs.push({p:p,ok:false,shown:Q.rev,more:Q.more,gaveUp:true});
  feedback(false);
}
/* 四句(下の句の前半)だけ取り出す。空白区切りがなければ7:7の比率で分ける */
function shimoFirst(p,kana){
  var t=String(kana?p.shimoKana:p.shimo).trim();
  if(/[\s　]/.test(t))return t.split(/[\s　]+/)[0];
  var u=kana?moras(t):Array.from(t);
  return u.slice(0,Math.round(u.length/2)).join('');
}
function submitFill(){
  if(Q.stage!=='input'&&Q.stage!=='more')return;
  var v=document.getElementById('ans').value;
  if(!v.trim())return;
  Q.stage='done';Q.answered=true;
  freezeKami(false);
  var p=Q.list[Q.i];
  var full=norm(v)===norm(p.shimoKana)||v.replace(/[\s　]/g,'')===p.shimo.replace(/[\s　]/g,'');
  var half=false;
  if(!full&&S.fill4!==false){
    var f1=shimoFirst(p,true),f2=shimoFirst(p,false);
    half=(norm(v.replace(/[\s　]/g,''))===norm(f1.replace(/[\s　]/g,''))||v.replace(/[\s　]/g,'')===f2.replace(/[\s　]/g,''));
  }
  var ok=full||half;
  Q.recs.push({p:p,ok:ok,shown:Q.rev,given:v,more:Q.more,half:half});
  feedback(ok,'<div class="note">あなたの答え: <strong style="color:var(--ink)">'+esc(v)+'</strong>'+(half?'(四句だけで正解にしました)':'')+'</div>');
}
function next(){
  if(Q.i>=Q.list.length-1){result();return}
  Q.i++;showQ();window.scrollTo(0,0);
}
function result(){
  stopTimer();stopTA();if(Q)Q.active=false;
  $app.className='';
  var n=Q.recs.length,ok=Q.recs.filter(function(r){return r.ok}).length;
  var okRecs=Q.recs.filter(function(r){return r.ok});
  var avg=okRecs.length?(okRecs.reduce(function(a,r){return a+r.shown},0)/okRecs.length):null;
  var miss=Q.recs.filter(function(r){return !r.ok});
  var h='<header><h1>結果</h1><p class="sub">'+(Q.attack?'タイムアタック(目標 '+Q.target+'秒/首)':(Q.mode==='choice'?'4択トレーニング':'穴埋めトレーニング'))+'</p></header>';
  h+='<section class="card"><div class="big-score num">'+ok+' <span style="font-size:22px">/ '+n+'</span></div><p class="note" style="margin:6px 0 0">正答率 <span class="num">'+(n?Math.round(ok/n*100):0)+'</span>%'+(Q.kimari?'　決まり字までで正解 <span class="num">'+Q.recs.filter(function(r){return r.ok&&!r.more}).length+'</span> 首':(avg!==null?'　正解した歌の平均は <span class="num">'+avg.toFixed(1)+'</span> 文字目':''))+'</p>';
  if(Q.attack){
    var inT=Q.recs.filter(function(r){return r.ok&&r.inTime}).length,avgT=Q.recs.length?Q.recs.reduce(function(a,r){return a+r.ms},0)/Q.recs.length/1000:0;
    h+='<p class="note" style="margin:6px 0 0">目標時間内に正解 <span class="num">'+inT+'</span> 首 ／ 平均解答時間 <span class="num">'+avgT.toFixed(1)+'</span> 秒</p>';
  }
  h+='<p class="note" style="margin:4px 0 0">'+(Q.kimari?'「わからない」を使わずに決まり字までで答えられた歌が多いほど、札を取る力がついています。':'平均の文字数が少ないほど、早く決まり字に気づけています。')+'</p></section>';
  if(miss.length){
    h+='<section class="card"><h2>間違えた歌 <span class="num">'+miss.length+'</span> 首</h2><ul class="miss">'+miss.map(function(r){return '<li>'+fullPoem(r.p)+(r.given?'<div class="note">あなたの答え: '+esc(r.given)+'</div>':'')+'</li>'}).join('')+'</ul></section>';
  }
  h+='<div class="modes">'+(miss.length?'<button class="btn primary big" data-act="retry">間違えた歌だけ復習する</button>':'')+'<button class="btn big" data-act="again">もう一度(同じ設定)</button><button class="btn big" data-act="home">ホームへ</button></div>';
  Q.missList=miss.map(function(r){return r.p});
  $app.innerHTML=h;window.scrollTo(0,0);
}

/* ---------- pair mode ---------- */
var P=null;
function startPair(list){
  stopTimer();if(Q)Q.active=false;
  var l=list||makeList();
  if(l.length<2)return;
  var first=l.slice(0,4);
  P={all:l,hide:S.pairHide==='shimo'?'shimo':'kami',kimari:S.kimari!==false,queue:l.slice(4),
     up:shuffle(first),lo:shuffle(first),matched:{},flipped:{},selU:null,selL:null,miss:{},locked:false,doneN:0,retryList:[]};
  showPair();
}
function pairUpperText(p){return P.kimari?kimarijiText(p):plainText(p,'kami',true)}
function pairCard(side,p){
  if(!p)return '<div class="pc empty" aria-hidden="true"></div>';
  var part=side==='u'?'kami':'shimo';
  var isDown=(P.hide===part)&&!P.flipped[side+p.no];
  var done=!!P.matched[p.no];
  var sel=(side==='u'?P.selU:P.selL)===p.no;
  var cls='pc'+(isDown?' down':'')+(done?' done':'')+(sel?' sel':'');
  var body,label;
  if(isDown){body='<span class="back">タップでめくる</span>';label='伏せた札'}
  else if(side==='u'&&P.kimari){body=vertHTML([moras(kimarijiText(p))],false);label=kimarijiText(p)}
  else{body=vertHTML(phrases(p,part),false);label=plainText(p,part,true)}
  return '<button class="'+cls+'" id="pc-'+side+p.no+'" data-act="pairpick" data-side="'+side+'" data-no="'+p.no+'"'+(done?' aria-disabled="true"':'')+' aria-label="'+esc(label)+'">'+body+'</button>';
}
function drawGrid(){
  var g=document.getElementById('pgrid');if(!g)return;
  g.innerHTML='<div class="pcol"><h3>上の句'+(P.kimari?'(決まり字)':'')+'</h3>'+P.up.map(function(p){return pairCard('u',p)}).join('')+'</div><div class="pcol"><h3>下の句</h3>'+P.lo.map(function(p){return pairCard('l',p)}).join('')+'</div>';
  var bar=document.getElementById('pbar');if(bar)bar.style.width=(P.doneN/P.all.length*100)+'%';
  var pn=document.getElementById('pnum');if(pn)pn.textContent=P.doneN+' / '+P.all.length;
}
function showPair(){
  $app.className='pairview';
  var h='<div class="prog"><span class="num" id="pnum"></span><div class="bar"><i id="pbar"></i></div><button class="btn small" data-act="quit">やめる</button></div>';
  h+='<p class="note" style="margin:8px 0 0">上の句と下の句を1枚ずつ選んで組にします。'+(P.hide==='kami'?'上の句':'下の句')+'は伏せてあり、タップでめくれます。'+(P.kimari?'上の句は決まり字までを表示します。':'')+'</p>';
  h+='<div class="pgrid" id="pgrid"></div><div id="pfb" class="note" role="status" aria-live="polite" style="min-height:1.6em;margin-top:10px"></div>';
  $app.innerHTML=h;drawGrid();
}
function pairFind(no){return P.all.filter(function(x){return x.no===no})[0]}
function pairPick(side,no){
  if(!P||P.locked||P.matched[no])return;
  var hiddenSide=P.hide==='kami'?'u':'l';
  var flippedNow=false;
  if(side===hiddenSide&&!P.flipped[side+no]){P.flipped[side+no]=true;flippedNow=true}
  var key=side==='u'?'selU':'selL';
  P[key]=(P[key]===no)?null:no;
  drawGrid();
  if(flippedNow){var el=document.getElementById('pc-'+side+no);if(el)el.classList.add('flip')}
  if(P.selU!==null&&P.selL!==null)pairJudge();
}
function pairJudge(){
  var u=P.selU,l=P.selL,fb=document.getElementById('pfb');
  P.locked=true;
  if(u===l){
    var p=pairFind(u);
    P.matched[u]=true;P.flipped['u'+u]=P.flipped['l'+u]=true;P.selU=P.selL=null;P.doneN++;
    drawGrid();
    fb.textContent='正解!'+(p.author?'('+p.author+')':'');
    setTimeout(function(){
      if(!P)return;
      var nxt=P.queue.length?P.queue.shift():null;
      var iu=P.up.indexOf(p),il=P.lo.indexOf(p);
      P.up[iu]=nxt;P.lo[il]=nxt;
      if(nxt&&iu===il){ // avoid the new pair sitting side by side
        var others=[];P.lo.forEach(function(x,i){if(i!==il&&x&&!P.matched[x.no])others.push(i)});
        if(others.length){var j=others[Math.floor(Math.random()*others.length)];var t=P.lo[j];P.lo[j]=P.lo[il];P.lo[il]=t}
      }
      if(!P.up.some(function(x){return x&&!P.matched[x.no]})&&!P.queue.length){pairResult();return}
      P.locked=false;drawGrid();
    },700);
  }else{
    ['u'+u,'l'+l].forEach(function(id){var c=document.getElementById('pc-'+id);if(c)c.classList.add('bad')});
    [u,l].forEach(function(no){if(!P.miss[no]){P.miss[no]=true}});
    fb.textContent='ちがいます。もう一度選んでください。';
    setTimeout(function(){
      if(!P)return;
      P.selU=P.selL=null;P.locked=false;drawGrid();
    },600);
  }
}
function pairResult(){
  $app.className='';
  var n=P.all.length,missed=P.all.filter(function(p){return P.miss[p.no]});
  var h='<header><h1>結果</h1><p class="sub">ペアトレーニング('+(P.hide==='kami'?'上の句を伏せる':'下の句を伏せる')+')</p></header>';
  h+='<section class="card"><div class="big-score num">'+(n-missed.length)+' <span style="font-size:22px">/ '+n+'</span></div><p class="note" style="margin:6px 0 0">まちがえずに組にできた歌の数です。</p></section>';
  if(missed.length)h+='<section class="card"><h2>まちがえた歌 <span class="num">'+missed.length+'</span> 首</h2><ul class="miss">'+missed.map(function(p){return '<li>'+fullPoem(p)+'</li>'}).join('')+'</ul></section>';
  h+='<div class="modes">'+(missed.length>=2?'<button class="btn primary big" data-act="pairretry">まちがえた歌だけ復習する</button>':'')+'<button class="btn big" data-act="pairagain">もう一度(同じ設定)</button><button class="btn big" data-act="home">ホームへ</button></div>';
  P.retryList=missed;
  $app.innerHTML=h;window.scrollTo(0,0);
}

/* ---------- fit vertical text into its box (字余り・フォント差の吸収) ---------- */
function fitAll(){
  fitQueued=false;
  var vs=[].slice.call(document.querySelectorAll('.vert'));if(!vs.length)return;
  var minf=1;
  vs.forEach(function(v){
    var base=parseFloat(v.dataset.sc0||v.style.getPropertyValue('--sc'))||1;v.dataset.sc0=base;
    v.style.setProperty('--sc',base);
    var box=v.getBoundingClientRect(),need=0,phs=v.querySelectorAll('.ph');
    for(var i=0;i<phs.length;i++){
      var rg=document.createRange();rg.selectNodeContents(phs[i]);
      var r=rg.getBoundingClientRect();if(r.height)need=Math.max(need,r.bottom-box.top);
    }
    if(box.height>0&&need>box.height+0.5)minf=Math.min(minf,box.height/need*0.99);
  });
  vs.forEach(function(v){v.style.setProperty('--sc',(parseFloat(v.dataset.sc0)*minf).toFixed(3))});
}
var fitQueued=false;
function queueFit(){if(!fitQueued){fitQueued=true;requestAnimationFrame(fitAll)}}
if(window.MutationObserver)new MutationObserver(queueFit).observe($app,{childList:true,subtree:true});
window.addEventListener('resize',function(){document.querySelectorAll('.vert').forEach(function(v){delete v.dataset.sc0;v.style.setProperty('--sc','1')});queueFit()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){document.querySelectorAll('.vert').forEach(function(v){v.style.setProperty('--sc',v.dataset.sc0||'1')});queueFit()});

/* ---------- events ---------- */
function refreshCount(){var c=document.getElementById('cnt');if(c)c.textContent=pool().length;
  var tn=document.getElementById('tagn');if(tn)tn.textContent=S.tags.length?S.tags.length+'件選択中':'';
  var mn=document.getElementById('mkn');if(mn)mn.textContent=S.marks.length?S.marks.length+'件選択中':'';
  var kn=document.getElementById('kjn');if(kn)kn.textContent=S.kjlen.length?S.kjlen.length+'件選択中':'';
  var nn=document.getElementById('nsn');if(nn)nn.textContent=S.nsheet.length?S.nsheet.length+'件選択中':'';
  var fn=document.getElementById('feeln');if(fn)fn.textContent=S.feel.length?S.feel.length+'件選択中':'';
  var dis=pool().length===0;document.querySelectorAll('[data-act="start4"],[data-act="startFill"],[data-act="startPair"],[data-act="startAttack"]').forEach(function(b){b.disabled=dis||(b.dataset.act==='startPair'&&pool().length<2)})}
$app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='home')return go(home);
  if(a==='data')return go(dataView);
  if(a==='p-all'){S.from=1;S.to=100;S.tags=[];S.feel=[];S.nsheet=[];S.kjlen=[];S.marks=[];saveSettings();return home()}
  if(a==='p-10'){S.from=1;S.to=10;S.tags=[];S.feel=[];S.nsheet=[];S.kjlen=[];S.marks=[];saveSettings();return home()}
  if(a==='p-koi'){S.from=1;S.to=100;S.tags=['恋'];S.feel=[];saveSettings();return home()}
  if(a==='p-aki'){S.from=1;S.to=100;S.tags=['秋'];S.feel=[];saveSettings();return home()}
  if(a==='g'||a==='f'){
    var arr=a==='g'?S.tags:S.feel,g=t.dataset.g,i=arr.indexOf(g);
    if(i>=0)arr.splice(i,1);else arr.push(g);
    saveSettings();t.setAttribute('aria-pressed',i<0);return refreshCount();
  }
  if(a==='confuse'){S.confuse=t.dataset.v==='1';saveSettings();return home()}
  if(a==='fill4'){S.fill4=t.dataset.v==='1';saveSettings();return home()}
  if(a==='mark'){
    var mno=parseInt(t.dataset.no,10),mid=parseInt(t.dataset.m,10);
    if(M[mno]===mid)delete M[mno];else M[mno]=mid;
    saveMarks();
    var bar=t.closest('.markbar');if(bar)bar.querySelectorAll('.mk').forEach(function(b){b.setAttribute('aria-pressed',M[mno]===parseInt(b.dataset.m,10))});
    return;
  }
  if(a==='mkf'){var fv=parseInt(t.dataset.m,10),fx=S.marks.indexOf(fv);if(fx>=0)S.marks.splice(fx,1);else S.marks.push(fv);saveSettings();t.setAttribute('aria-pressed',fx<0);return refreshCount()}
  if(a==='kj'){var kv=parseInt(t.dataset.n,10),kx=S.kjlen.indexOf(kv);if(kx>=0)S.kjlen.splice(kx,1);else S.kjlen.push(kv);saveSettings();t.setAttribute('aria-pressed',kx<0);return refreshCount()}
  if(a==='ns'){var nv=parseInt(t.dataset.n,10),ix=S.nsheet.indexOf(nv);if(ix>=0)S.nsheet.splice(ix,1);else S.nsheet.push(nv);saveSettings();t.setAttribute('aria-pressed',ix<0);return refreshCount()}
  if(a==='script'){var sv=t.dataset.s==='kanji'?'kanji':'kana';if(t.dataset.p==='shimo')S.scriptS=sv;else S.scriptK=sv;saveSettings();return home()}
  if(a==='startAttack'){var la=makeList();if(la.length&&data.length>=4)startQuiz('choice',la,true);return}
  if(a==='target'){S.target=parseInt(t.dataset.v,10);saveSettings();return home()}
  if(a==='start4'){var l=makeList();if(l.length&&data.length>=4)startQuiz('choice',l);return}
  if(a==='startFill'){var l2=makeList();if(l2.length)startQuiz('fill',l2);return}
  if(a==='startPair'){if(pool().length>=2){go(function(){startPair()})}return}
  if(a==='pairhide'){S.pairHide=t.dataset.v==='shimo'?'shimo':'kami';saveSettings();return home()}
  if(a==='pairpick')return pairPick(t.dataset.side,parseInt(t.dataset.no,10));
  if(a==='pairagain'){if(pool().length>=2)startPair();return}
  if(a==='pairretry'){startPair(shuffle(P.retryList));return}
  if(a==='quit'){P=null;return go(home)}
  if(a==='pick')return pick(parseInt(t.dataset.k,10));
  if(a==='wakatta')return wakatta();
  if(a==='cancelans')return cancelAnswer();
  if(a==='kimari'){S.kimari=t.dataset.v==='1';saveSettings();return home()}
  if(a==='dontknow')return dontknow();
  if(a==='giveup')return giveUp();
  if(a==='submit')return submitFill();
  if(a==='next')return next();
  if(a==='again')return startQuiz(Q.mode,makeList(),Q.attack);
  if(a==='retry')return startQuiz(Q.mode,shuffle(Q.missList),Q.attack);
  if(a==='import'){
    var r=parseImport(document.getElementById('importText').value);
    if(r.err)return dataView(esc(r.err));
    if(r.out.length<4)return dataView('読み込めた歌が'+r.out.length+'首でした。4首以上必要です。'+(r.errors.length?'<br>'+r.errors.slice(0,5).map(esc).join('<br>'):''));
    data=r.out;lsSet('hyakunin_data_v1',JSON.stringify(data));
    var mx=Math.max.apply(null,data.map(function(p){return p.no}));
    S.from=1;S.to=Math.max(mx,10);S.tags=[];S.feel=[];S.nsheet=[];S.kjlen=[];S.marks=[];saveSettings();
    return dataView('<strong>'+data.length+'首を読み込みました。</strong>'+(r.errors.length?'<br>読み込めなかった行 '+r.errors.length+' 件<br>'+r.errors.slice(0,8).map(esc).join('<br>'):'')+(r.warns.length?'<br>確認が必要な項目 '+r.warns.length+' 件(読み込み自体は済んでいます)<br>'+r.warns.slice(0,8).map(esc).join('<br>'):''));
  }
  if(a==='resetdemo'){lsDel('hyakunin_data_v1');data=DEMO.slice();S.from=1;S.to=100;saveSettings();return dataView('テスト用の歌に戻しました。')}
});
$app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='from'||t.id==='to'){
    var v=parseInt(t.value,10);
    if(!isNaN(v)){S[t.id]=Math.min(100,Math.max(1,v));saveSettings();refreshCount()}
  }else if(t.id==='speed'){S.speed=parseFloat(t.value);saveSettings();document.getElementById('speedv').textContent=S.speed.toFixed(1)}
});
$app.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='count'){S.count=t.value;saveSettings();return}
  if(t.id==='csvFile'&&t.files&&t.files[0]){
    t.files[0].arrayBuffer().then(function(buf){
      var txt;
      try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}
      catch(err){try{txt=new TextDecoder('shift_jis').decode(buf)}catch(e2){txt=''}}
      var ta=document.getElementById('importText');
      if(ta)ta.value=txt;
      var b=document.querySelector('[data-act="import"]');
      if(b)b.click();
    });
  }
});
$app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='ans'&&!e.isComposing){e.preventDefault();submitFill()}});

/* 4択: after the result is shown, a tap anywhere moves on (short lock avoids the answering tap also advancing) */
document.addEventListener('click',function(e){
  if(!Q||!Q.active||Q.mode!=='choice'||Q.stage!=='done'||Date.now()<Q.nextOkAt)return;
  var t=e.target.closest&&e.target.closest('[data-act]');
  if(t&&(t.dataset.act==='next'||t.dataset.act==='quit'||t.dataset.act==='mark'))return;
  next();
});

home();
})();
